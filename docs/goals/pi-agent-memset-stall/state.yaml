version: 2

goal:
  title: "pi_agent watch-once stalls after first chunk with 22 GB RSS memset loop"
  slug: "pi-agent-memset-stall"
  kind: existing_plan
  tranche: "Drive spec 014 through $codex-plan → $codex-review → $codex-implement → $code-verify → $finalize until the upstream PR is open and the pi-agent backfill completes for ≥2,500 conversations with peak RSS <8 GB."
  status: active
  intake:
    original_request: "/issue for pi_agent stall (~10 min) — captures findings (PID, RSS pattern, that it was a different signature from spec-013) before they get stale"
    interpreted_outcome: "Ship a small, upstreamable fix so cass index --watch-once ~/.pi/agent/sessions completes the user's pi-agent historical backfill (≥2,500 conversations) with peak RSS < 8 GB on v0.4.7 + PR #233."
    input_shape: existing_plan
    audience: "Dale Carman (fork maintainer) and upstream Dicklesworthstone/coding_agent_session_search"
    authority: requested
    proof_type: artifact
    completion_proof: "cass index --watch-once ~/.pi/agent/sessions --json --no-progress-events returns success:true with conversations>=2,500, peak RSS<8 GB, the post-fix sample output no longer shows the _platform_memset hot frame, and the upstream PR is open."
    likely_misfire: "Skipping $codex-review between $codex-plan and $codex-implement, or jumping to a fix before profiling locates the actual allocation site."
    blind_spots_considered:
      - "Release binary frames are stripped; profiling build (target/profiling) is required to symbolicate."
      - "Bad allocation may live inside franken-agent-detection (external crate) — fix at cass ingest boundary, not by vendoring."
      - "22 GB RSS may be cumulative across the in-memory Vec<NormalizedConversation>, not one pathological conversation; that changes the fix shape."
      - "stall_detected watchdog did not fire because lock heartbeat kept it satisfied. Out of scope here; worth a follow-up issue."
    existing_plan_facts:
      - "$issue satisfied: specs/014-pi-agent-memset-stall/spec.md exists with bead coding_agent_session_search-373b1 and provenance sentinel issue:complete:v1."
      - "$codex-shape satisfied via explicit shape-skip recorded in specs/014-pi-agent-memset-stall/log.md (clear bug fix with precise reproducer and well-precedented fix class; the open question is the specific allocation site, which is a profiling question not a shaping question)."
      - "Spec 014 Selected Shape names Phase 1 (Localise via profiling build + sample), Phase 2 candidate (a) cap-at-normalization or (b) cap-at-ingest, and Phase 3 (verify + focused regression test + single-commit upstream PR mirroring PR #233 style)."
      - "Same-binary verification: post-PR #233 cass v0.4.7 already processed claude_code (2,573), codex (5,712), opencode (976) without stall, so the bug is pi-specific not a general indexer regression."

rules:
