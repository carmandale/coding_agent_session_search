# GoalBuddy v2 state.yaml
# Board truth for spec 015 — watch-once scan streaming.
# goal.md is the editable charter; spec.md owns what/why; this file owns task state.

version: 2

goal:
  title: "Ship spec 015 — watch-once scan streaming for pi-agent historical backfill"
  slug: "watch-once-streaming-scan"
  kind: existing_plan
  tranche: "Drive spec 015 through $codex-plan → $codex-review → $codex-implement → $code-verify → $finalize until pi-agent watch-once completes the user's full historical backfill (≥1,970 conversations indexed) with no forward-capture regression and no spec-013 regression."
  status: active
  intake:
    original_request: "if 1 works...if 33 work, than 2700 will work. what is the right way to do it?"
    interpreted_outcome: "Ship a cass-side change so cass index --watch-once ~/.pi/agent/sessions completes the user's pi-agent historical backfill (≥1,970 conversations indexed, ≥95% of the 2,073 jsonl corpus) by chunking the scan phase the same way PR #233 chunked the persist phase."
    input_shape: existing_plan
    audience: "Dale Carman (cass user) and upstream Dicklesworthstone/coding_agent_session_search"
    authority: requested
    proof_type: artifact
    completion_proof: "cass index --watch-once ~/.pi/agent/sessions --json --no-progress-events returns success:true with pi_agent row count in DB ≥1,970; forward-capture watcher unchanged; spec-013 chunk-size behaviour preserved; no message-coverage regression."
    likely_misfire: "Re-litigating spec 014's 8 GB peak-RSS threshold inside this spec. That threshold is explicitly dropped per spec 015 Constraint section; the architectural fix for the in-memory FTS5 floor is tracked separately and is not gating spec 015."
    blind_spots_considered:
      - "ScanContext may not natively support file-scoped sub-contexts for Shape A — plan must verify."
      - "Connector::supports_streaming_scan() returns false for pi today; Shape B's optimal path only reached after a separate upstream FAD PR."
      - "Per-conversation transformations (compact_large_connector_extras, attach_raw_mirror_capture at src/indexer/mod.rs:16263-16268) must still run on each chunk."
      - "Forward-capture watcher path must remain untouched."
    existing_plan_facts:
      - "$issue satisfied: specs/015-watch-once-streaming-scan/spec.md exists with bead coding_agent_session_search-81z91 and provenance sentinel issue:complete:v1."
      - "$codex-shape satisfied via explicit shape-skip recorded in specs/015-watch-once-streaming-scan/log.md (chunk-the-scan extension of PR #233 chunk-the-persist pattern; clear precedent and well-defined surface at src/indexer/mod.rs:16248)."
      - "Spec 015 Selected Shape names Shape A (discover_source_files + per-batch scan(), cass-only) as the default route, with Shape B (scan_with_callback with per-callback batching) as automatic fall-forward when supports_streaming_scan() returns true."
      - "Connector trait infrastructure for streaming already exists (scan_with_callback, discover_source_files, supports_streaming_scan) per FAD connectors/mod.rs:62-104. Cass already uses scan_with_callback in non-watch-once paths at src/indexer/mod.rs:8534, :8596. Watch-once is the holdout that still calls bulk scan() at :16248."
      - "PR #233 chunked-persist behaviour (CASS_WATCH_INGEST_CHUNK_SIZE) is preserved; new scan chunking composes with it, not replaces it."
      - "Spec 014's acceptance #2 (peak RSS < 8 GB) is dropped for this spec; the fsqlite_ext_fts5 in-memory floor (~30 GB at the user's corpus size) requires a separate upstream architectural change tracked in a follow-up bead."
      - "PR #90 (upstream frankensqlite savepoint-clone fix) is orthogonal to spec 015 and merges on its own merits."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/watch-once-streaming-scan/"
    command: "npx goalbuddy board docs/goals/watch-once-streaming-scan"
  github_projects:
    status: not_requested
    url: null
    command: "npx goalbuddy extend github-projects"
    missing: []

active_task: T003

