version: 2

goal:
  title: "Recover cass session ingestion and watcher"
  slug: "cass-session-ingestion-recovery"
  kind: recovery
  tranche: "Drive specs/016-cass-recovery-ingestion through the Dale Codex workflow until upstream sync, priority-agent ingestion/searchability, and watcher operation are proven live."
  status: active
  intake:
    original_request: "be in sync with upstream. process all sessions and allow them to be searchable... then set up a watcher"
    interpreted_outcome: "cass is deliberately upstream-synced, Pi Agent/Claude Code/Codex histories are searchable, and com.cass.index-watch keeps future sessions indexed."
    input_shape: recovery
    audience: "Dale Carman as cass user/operator"
    authority: requested
    proof_type: metric
    completion_proof: "git upstream ancestor proof or blocker; cass DB/search reconciliation for Pi Agent, Claude Code, and Codex; launchctl and new-session watcher proof."
    likely_misfire: "Treating spec artifacts, partial commits, or healthy lexical status as success while Pi remains at 36 rows or the watcher remains unloaded."
    blind_spots_considered:
      - "Spec 015 owns only a Pi watch-once slice; this board owns the product-level recovery."
      - "cass health can be healthy while com.cass.index-watch is absent."
      - "Semantic search is optional and missing semantic assets must not block lexical proof."
      - "Upstream sync may require reconciling 19 local commits with 12 upstream commits."
      - "OpenCode and factory are bonus coverage unless they block priority-agent indexing."
    existing_plan_facts:
      - "$issue completed: specs/016-cass-recovery-ingestion/spec.md exists with bead coding_agent_session_search-1vxuf."
      - "Formal shaping is deliberately queued next because this is repeated-failure recovery work."
      - "Issue-time upstream baseline: HEAD b807ef175dcdeeb48b912a22913fbcd68fb86cb8, upstream/main c5d7be3b585a38546759cb5331401b9ad1ac06ba, ahead/behind 19/12."
      - "Issue-time cass stats: 9657 conversations, 903256 messages, codex 5712, claude_code 2574, pi_agent 36."
      - "Issue-time raw counts: Pi 2076 jsonl, Claude 2557 jsonl, Codex 4187 jsonl."
      - "Issue-time launchd state: com.cass.index-watch absent; health-watchdog and sync-to-mini loaded."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

