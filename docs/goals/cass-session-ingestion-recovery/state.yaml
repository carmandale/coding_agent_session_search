workflow:
  profile: dale_codex
  sequence:
    - command: "$issue"
      purpose: "Create or confirm the bead-backed spec."
      when: "Already completed for specs/016-cass-recovery-ingestion/."
    - command: "$codex-shape"
      purpose: "Shape the recovery route across upstream sync, ingestion, searchability, and watcher proof."
      when: "Run next because this is repeated-failure recovery work."
    - command: "$codex-plan"
      purpose: "Create plan.md, tasks.md, planning transcript, and plan provenance."
      when: "Run after shaping selects the route."
    - command: "$codex-review"
      purpose: "Get a fresh independent Codex approval of the plan."
      when: "Always run after $codex-plan and before $codex-implement."
    - command: "$codex-implement"
      purpose: "Implement the approved plan with scoped writes and verification."
      when: "Run after $codex-review approves."
    - command: "$code-verify"
      purpose: "Run independent post-implementation Codex verification against live acceptance."
      when: "Run after $codex-implement records implement-receipt.md."
    - command: "$finalize"
      purpose: "Close the bead, create final handoff, commit, and push verified fork work."
      when: "Run only after $code-verify approval."

