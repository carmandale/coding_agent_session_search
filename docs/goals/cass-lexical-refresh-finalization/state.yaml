goal:
  title: "Cass Lexical Refresh Finalization"
  slug: "cass-lexical-refresh-finalization"
  kind: recovery
  tranche: "Finish the remaining cass large-corpus refresh recovery loop with issue/spec, patch, live proof, and upstream note if warranted."
  status: done
  execution_lane: dale_workflow
  intake:
    original_request: "I agree with the next 4 steps you are proposing. $goalbuddy these and get them done"
    interpreted_outcome: "Get cass usable again for recent and historical sessions by fixing the remaining large-corpus lexical refresh finalization failure and reporting upstream only with clean evidence."
    execution_lane_reason: "defaulted to Dale workflow; no explicit direct-goal opt-out phrase matched"
    input_shape: existing_plan
    source_spec_path: null
    source_bead: null
    audience: Dale
    authority: approved
    proof_type: live_state
    prior_failure_signal: true
    completion_proof: "Live cass status, marker, index metadata, and search probes agree that the large-corpus refresh path is usable without custom band-aids."
    likely_misfire: "Stopping after a search hit or board/spec artifact while cass status remains stale or pending metadata still triggers unsafe rebuild loops."
    blind_spots_considered:
      - "Large historical corpus may expose a different OOM stage than individual watch-once ingestion."
      - "Installed binary and live index state can drift from the checkout."
      - "Upstream comments are only useful after the local evidence is precise."
    existing_plan_facts:
