      - "Separate this failure from full-rebuild daily_stats OOM and watch-once success-reporting OOM."
      - "Do not mutate live index state during diagnosis unless it is part of a later active task."
    expected_output:
      - "Focused bead/spec path or existing bead decision"
      - "Root-cause hypothesis with source references"
      - "Patch target and verification plan"
    receipt:
      result: done
      summary: "Created and claimed focused spec 018 for bead coding_agent_session_search-3135s; diagnosed stale deferred lexical marker plus completed checkpoint as a separate finalization/rebuild-loop issue."
      evidence:
