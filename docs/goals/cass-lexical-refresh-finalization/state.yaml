      - "Create a new local issue/spec or attach to the existing GoalBuddy thread for the large-corpus lexical refresh finalization bug."
      - "Patch the rebuild/finalization path so completed DB-matching checkpoint state can finalize metadata and resolve the pending marker without restarting a whole rebuild."
