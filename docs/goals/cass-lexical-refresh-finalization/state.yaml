          - "cass triage --json recommended the documented refresh command because the index was stale by age only."
          - "cass index --json --no-progress-events --data-dir '/Users/dalecarman/Library/Application Support/com.coding-agent-search.coding-agent-search' succeeded on the final installed binary with conversations=40, messages=714, lexical_strategy=incremental_inline, quarantined_conversations=7."
          - "cass health/status --json reported healthy=true, index.status=ready, fresh=true, pending.sessions=0, rebuild.active=false on the final installed binary."
          - "Search probes for `fresh-context independent north-star checker`, `documented triage refresh path still OOMs`, and `HSBC scene five hover effects` returned results."
          - "A 2026-05-18 03:19 refresh of health/status still reported healthy=true, index.status=ready, fresh=true, pending.sessions=0, rebuild.active=false; the HSBC Scene 5 lexical probe returned 3 Codex hits."
