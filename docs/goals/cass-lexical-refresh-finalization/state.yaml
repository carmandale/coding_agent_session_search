    purpose_source_sections:
      - "Prior senior-dev assessment"
      - "Spec 017 evidence"
  purpose_contract:
    confirmation: user_confirmed
    tangible_outcome: "Dale can actually use cass against recent and historical sessions through documented or upstream-compatible behavior, without custom local watcher/index band-aids."
    done_proof:
      - "Focused issue/spec exists for the remaining failure."
      - "Patch is tested and verified."
      - "Live cass status/marker/search proof matches the user outcome."
      - "Upstream issue/comment is posted only if clean evidence supports it."
    false_positives:
      - "GoalBuddy board exists but no live cass behavior changed."
      - "Individual search works while status remains stale or pending marker remains unresolved."
      - "A local patch is present but not installed/proven against live state."
    required_outcome_checks:
      - id: OC1
        description: "Focused issue/spec records the remaining bug and separates it from upstream #239/#240."
        status: pass
