rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  purpose_contract_required: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: unknown
  worker: unknown
  judge: unknown

visual_board:
  selected: local
  local:
    status: starting
    url: "http://goalbuddy.localhost:41737/cass-lexical-refresh-finalization/"
    command: "npx goalbuddy board /Users/dalecarman/dev/coding_agent_session_search/docs/goals/cass-lexical-refresh-finalization"
  github_projects:
    status: not_requested
    url: null
    command: "npx goalbuddy extend github-projects"
    missing: []

workflow:
  profile: dale_codex
  sequence:
    - command: "$issue"
      purpose: "Create or confirm the bead-backed spec."
      when: "Run only when a matching spec does not already exist."
    - command: "$codex-shape"
      purpose: "Shape ambiguous, strategic, repeated-failure, or root-cause work before planning."
      when: "Required unless shaping already exists or a concrete shape-skip reason proves there is no meaningful ambiguity and direction is clear enough to plan immediately."
    - command: "$codex-plan"
      purpose: "Create plan.md, tasks.md, planning transcript, and plan provenance."
      when: "Run after the spec is shaped or shaping is explicitly skipped."
    - command: "$codex-review"
      purpose: "Get a fresh independent Codex approval of the plan."
      when: "Always run after $codex-plan and before $codex-implement."
    - command: "$codex-implement"
      purpose: "Implement the approved plan with per-chunk Codex validation."
      when: "Run after $codex-review approves."
    - command: "$code-verify"
      purpose: "Run independent post-implementation Codex verification."
      when: "Run after $codex-implement records implement-receipt.md."
    - command: "$finalize"
      purpose: "Close the bead, create final handoff, commit, and push."
      when: "Run only after $code-verify approval."

active_task: null

