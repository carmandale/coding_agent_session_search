final_solutions:
  - problem: "Need per-connector disk file counting without duplicating scan logic"
    solution: "Each connector's count_disk_files() mirrors its scan() file-selection logic (same WalkDir patterns, same extensions, same helpers like find_chat_files/session_files)"
  - problem: "Some connectors (Cursor) use SQLite where file count != conversation count"
    solution: "count_disk_files() returns Option<usize>; None means non-comparable. Status becomes 'skip' with reconciliation_notes() explaining why"
  - problem: "Factory key 'claude' differs from DB agent_slug 'claude_code'"
    solution: "Slug mapping HashMap in reconciliation block: ('claude' -> 'claude_code')"
  - problem: "Need to detect both missing files AND orphaned DB entries"
    solution: "Signed i64 delta (disk - db). Positive = un-indexed files, negative = orphaned DB entries"

final_decisions:
  - decision: "Built on fix/index-gaps branch, not main"
    rationale: "main moved connectors to external franken_agent_detection crate (can't modify trait there) and doesn't compile on rustc 1.88"
  - decision: "count_disk_files() is a required trait method, not optional"
    rationale: "Compile-time enforcement ensures every new connector must implement it"
  - decision: "Reconciliation does not affect exit code"
    rationale: "Per spec: deltas are expected (filtered sessions, empty files, etc.) and should not cause CI failures"

