outcome: SUCCEEDED

final_solutions:
  - name: "Watcher kill loop broken"
    description: |
      Root cause: health watchdog killed the watcher every 10 minutes via SIGKILL
      (600s stale threshold too tight for 300s heartbeat + scan time). New watchdog
      uses heartbeat file age (2700s threshold) instead of cass health staleness.
      Kill sequence changed from immediate SIGKILL to SIGTERM → 120s → SIGKILL.
  - name: "Graceful shutdown via SIGTERM"
    description: |
      Added signal_hook-based SIGTERM/SIGINT handler. Shutdown flag checked at two
      levels: between connector iterations in reindex_paths, and after every callback
      in watch_sources. No final t_index.commit() needed — each connector iteration
      commits independently.
  - name: "FAD connector adapter"
    description: |
      Generic FadAdapter<T> wraps franken-agent-detection connectors to implement our
      4-method Connector trait. Field-by-field type conversion for structurally
      identical types. ScanRoot/ScanContext/Origin conversion handles local vs remote.

final_decisions:
  - decision: "Keep follow_links(true) on PiAgent WalkDir"
    rationale: "Removing it would silently drop 2,098 clawdbot sessions via symlink. Added max_depth(10) instead."
  - decision: "strip = debuginfo (not none or symbols)"
    rationale: "Keeps symbol table for sample output, strips large DWARF info. Best size/diagnosability tradeoff."
  - decision: "Stay diverged from upstream main, use FAD for new connectors only"
    rationale: "Full rebase is 1400+ commit merge (days of work). FAD dep is clean — no franken crates. Hybrid approach gets new connectors without risking our watcher fix."
  - decision: "Heartbeat threshold 2700s"
    rationale: "Must exceed full_scan_interval (1800s) + max scan duration (~600s) + margin (300s)."
  - decision: "PiAgent scan() uses exact Self::home() comparison"
    rationale: "Prevents remote Codex/Factory sessions dirs from being accepted while supporting arbitrary PI_CODING_AGENT_DIR values."

